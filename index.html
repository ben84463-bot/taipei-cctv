<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>臺北路口監視器</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{
  --bg:#1b1c1f; --panel:#26282c; --panel2:#2f3236; --line:#3a3d42;
  --text:#e8e8e8; --muted:#9a9ea5; --accent:#4f9cff; --sel:#ffb020; --danger:#ff5d5d; --ok:#3ecf8e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
header{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#202125}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px}
header .sub{color:var(--muted);font-size:12px}
header .sp{flex:1}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.pill b{color:var(--sel)}
#app{display:flex;height:calc(100% - 52px)}
aside{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside section{padding:12px 14px;border-bottom:1px solid var(--line)}
aside h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=search],input[type=number],select{background:#1d1e21;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font:inherit}
input[type=search]{width:100%}
.status{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.status.err{color:var(--danger)}
.list{flex:1;overflow:auto;min-height:0}
.item{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid #2c2e32;cursor:pointer}
.item:hover{background:#2c2f34}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--muted);font-size:12px;flex:none}
.item .ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);flex:none}
.item.sel .ck{background:var(--sel);border-color:var(--sel)}
#main{flex:1;display:flex;min-width:0;position:relative}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0}
#grid{display:none;flex:1.25;min-width:0;background:#111;border-left:1px solid var(--line);flex-direction:column}
#app.split #grid{display:flex}
#grid .gh{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:#1a1b1e}
#grid .gh .sp{flex:1}
#tiles{flex:1;display:grid;gap:4px;padding:4px;min-height:0;grid-auto-rows:1fr}
.tile{position:relative;background:#000;border-radius:4px;overflow:hidden;min-height:0}
.tile video,.tile img,.tile iframe{width:100%;height:100%;object-fit:contain;display:block;border:0;background:#000}
.tile .cap{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:4px 6px;
  background:linear-gradient(#000c,#0000);font-size:12px}
.tile .cap .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cap .no{background:var(--sel);color:#000;border-radius:3px;padding:0 5px;font-weight:700}
.tile .cap button{background:#0008;border:1px solid #fff3;border-radius:4px;padding:0 6px;font-size:12px}
.tile iframe.embed,.pp iframe.embed{background:#000}
.tile .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);font-size:12px;padding:12px;pointer-events:none}
.tile .msg a{pointer-events:auto;color:var(--accent)}
.tile .v{z-index:0}
.tile .hit{position:absolute;inset:0;z-index:1;cursor:zoom-in}
.tile .cap{z-index:3}
.tile .msg{z-index:2}
#tiles.hasfocus{grid-template-columns:1fr!important;grid-template-rows:1fr!important}
#tiles.hasfocus .tile:not(.focus){display:none}
.tile.focus .hit{cursor:zoom-out}
.tile .rec{position:absolute;right:8px;bottom:8px;z-index:3;background:#d22;color:#fff;border-radius:4px;padding:1px 7px;font-size:12px;display:none}
.tile.recording .rec{display:block}
.tile.recording{outline:2px solid #d22;outline-offset:-2px}
.tile:fullscreen{border-radius:0}
#splitter{width:7px;flex:none;cursor:col-resize;background:var(--line);display:none;position:relative}
#splitter::after{content:"";position:absolute;top:50%;left:2px;width:3px;height:36px;margin-top:-18px;border-radius:2px;background:#777}
#splitter:hover,#splitter.drag{background:var(--accent)}
#app.split #splitter{display:block}
#app.split #grid{flex:none;width:var(--gridW,58%)}
body.dragging{user-select:none;cursor:col-resize}
body.dragging iframe{pointer-events:none}
#dlLog{max-height:110px;overflow:auto;font-size:11px;color:var(--muted);margin-top:6px}
#dlLog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #2c2e32;padding:2px 0}
.empty{color:var(--muted);display:flex;align-items:center;justify-content:center;flex:1;text-align:center;padding:20px}
/* map popup */
.maplibregl-popup-content{background:var(--panel);color:var(--text);padding:8px;border-radius:8px;box-shadow:0 6px 20px #0008;width:300px}
.maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
.maplibregl-popup-close-button{color:#fff;font-size:18px}
.pp h3{font-size:13px;margin:0 22px 6px 0}
.pp .v{aspect-ratio:16/10;background:#000;border-radius:4px;overflow:hidden;position:relative}
.pp .row{margin-top:6px}
.me-dot{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px #4f9cff44}
#geo{position:absolute;top:10px;left:10px;z-index:5;width:min(380px,calc(100% - 70px))}
#geo form{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 4px 14px #0007}
#geo input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);padding:9px 12px;font:inherit;outline:none}
#geo form button{background:transparent;border:0;border-left:1px solid var(--line);padding:0 12px}
#geoRes{margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:none;max-height:50vh;overflow-y:auto;box-shadow:0 4px 14px #0007}
#geoRes .r{padding:8px 12px;border-bottom:1px solid #2c2e32;cursor:pointer}
#geoRes .r:hover{background:#2c2f34}
#geoRes .r small{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#geoRes .r .tag{font-size:11px;color:#000;background:var(--sel);border-radius:3px;padding:0 4px;margin-right:6px}
#geoRes .info{padding:8px 12px;color:var(--muted);font-size:12px}
.place-pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:#ff5d5d;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px #000a}
#cnt{position:relative;display:inline-block;color:var(--text);border-bottom:1px dashed var(--muted);cursor:pointer}
#cntPop{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:210px;background:#1d1e21;border:1px solid var(--line);border-radius:8px;padding:6px 0;box-shadow:0 6px 18px #000a;cursor:default}
#cnt:hover #cntPop,#cnt.open #cntPop{display:block}
#cntPop .h{padding:2px 12px 6px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);margin-bottom:4px}
#cntPop .c{display:flex;align-items:center;gap:8px;padding:4px 12px;cursor:pointer}
#cntPop .c:hover{background:#2c2f34}
#cntPop .c .bar{flex:1;height:6px;background:#2c2f34;border-radius:3px;overflow:hidden}
#cntPop .c .bar i{display:block;height:100%;background:var(--sel)}
#cntPop .c b{min-width:42px;text-align:right;font-weight:600}
#cntPop .c span:first-child{min-width:48px}
#cntPop .f{padding:6px 12px 2px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:4px}
.rpt{display:flex;align-items:center;gap:6px;margin-top:6px}
.rpt .lb{flex:none;width:34px;color:var(--muted);font-size:12px}
.rpt .v{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpt .btn{padding:3px 7px;font-size:12px}
.btn.picking{border-color:var(--sel);color:var(--sel)}
.route-pin{width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px #000a}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:8px;display:none;z-index:50}
#mobbar{display:none}
@media (max-width:820px){
  #splitter{display:none!important}
  #app.split #grid{width:auto;flex:1}
  aside{position:absolute;z-index:20;top:52px;bottom:0;left:0;transform:translateX(-100%);transition:.2s}
  #app.side aside{transform:none}
  #app.split #mapwrap{display:none}
  #mobbar{display:inline-flex}
  header .sub{display:none}
}
</style>
</head>
<body>
<header>
  <button class="btn" id="mobbar" onclick="toggleSide()">☰</button>
  <h1>路口監視器即時影像</h1>
  <span class="sub">資料：臺北市交通管制工程處 ATIS（同臺北城市儀表板 D020301）</span>
  <span class="sp"></span>
  <span class="pill">已選 <b id="selCount">0</b> / 16</span>
  <button class="btn" id="viewBtn" onclick="toggleSplit()">多畫面</button>
</header>
<div id="app">
  <aside>
    <section>
      <h2>資料來源</h2>
      <div class="row">
        <button class="btn primary" onclick="loadFromApi()">重新載入</button>
        <label class="btn">匯入 JSON<input type="file" accept=".json,.geojson" hidden onchange="loadFromFile(this.files[0])"></label>
      </div>
      <div class="status" id="dataStatus">載入中…</div>
    </section>
    <section>
      <h2>我的位置／搜尋地點的附近</h2>
      <div class="row">
        <button class="btn" id="locBtn" onclick="toggleLocate()">📍 開始定位</button>
        <select id="radius" onchange="renderList()">
          <option value="300">300 公尺</option><option value="500" selected>500 公尺</option>
          <option value="1000">1 公里</option><option value="2000">2 公里</option>
        </select>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="nearBtn" onclick="addNearest()" disabled>加入最近的畫面</button>
        <label class="row" style="gap:4px;font-size:12px;color:var(--muted)"><input type="checkbox" id="follow" checked>地圖跟隨</label>
      </div>
      <div class="status" id="locStatus">尚未定位</div>
    </section>
    <section>
      <h2>路線鏡頭</h2>
      <div class="rpt"><span class="lb">起點</span><span class="v" id="rA">未設定</span>
        <button class="btn" id="pickA" onclick="pickMode('A')" title="在地圖上點選起點">點地圖</button>
        <button class="btn" onclick="useRef('A')" title="使用目前搜尋的地點，若無則用我的位置">用搜尋／定位</button></div>
      <div class="rpt"><span class="lb">終點</span><span class="v" id="rB">未設定</span>
        <button class="btn" id="pickB" onclick="pickMode('B')" title="在地圖上點選終點">點地圖</button>
        <button class="btn" onclick="useRef('B')" title="使用目前搜尋的地點，若無則用我的位置">用搜尋／定位</button></div>
      <div class="row" style="margin-top:6px">
        <select id="rBuf" title="鏡頭距離路線多遠以內才算沿線">
          <option value="40">沿線 40 m</option><option value="80" selected>沿線 80 m</option><option value="150">沿線 150 m</option></select>
        <select id="rMode" title="沿線鏡頭超過 16 個時的取法">
          <option value="even" selected>平均分布取 16</option><option value="first">從起點取 16</option></select>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn primary" id="rGo" onclick="planRoute()" disabled>規劃路線並排入畫面</button>
        <button class="btn" onclick="clearRoute()">清除</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="rCsv" onclick="exportRouteCsv()" disabled>下載路線鏡頭清單 CSV</button>
      </div>
      <div class="status" id="rStatus">設定起點與終點後，依行車路線把沿途鏡頭依序排入多畫面（會取代目前的選取）。</div>
    </section>
    <section>
      <h2>下載</h2>
      <div class="row">
        <button class="btn" onclick="snapAll()">📷 全部截圖</button>
        <select id="recSec"><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option><option value="300">5 分鐘</option></select>
        <button class="btn" id="recAllBtn" onclick="recordAll()">⏺ 全部錄影</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" onclick="exportCsv(false)">已選清單 CSV</button>
        <button class="btn" onclick="exportCsv(true)">全部監視器 CSV</button>
        <button class="btn" onclick="exportLog()">下載紀錄（SHA-256）</button>
      </div>
      <div class="status">截圖與錄影會在畫面左下角加註鏡頭名稱與時間。每一格也可單獨按 📷／⏺。</div>
      <div id="dlLog"></div>
    </section>
    <section>
      <input type="search" id="q" placeholder="搜尋路名或編號，例如：復興北路" oninput="renderList()">
      <div class="row" style="margin-top:6px">
        <button class="btn" onclick="clearAll()">清除全部選取</button>
      </div>
    </section>
    <div class="list" id="list"></div>
  </aside>
  <div id="main">
    <div id="mapwrap"><div id="map"></div>
      <div id="geo">
        <form onsubmit="geoSearch(event)">
          <input id="geoQ" type="search" placeholder="搜尋地點、地址或路口，例如：南京復興站" autocomplete="off">
          <button type="button" id="geoClear" title="清除地點" onclick="clearPlace()" style="display:none">✕</button>
          <button type="submit" title="搜尋">🔍</button>
        </form>
        <div id="geoRes"></div>
      </div></div>
    <div id="splitter" title="拖曳調整地圖與畫面的大小"></div>
    <div id="grid">
      <div class="gh"><span id="gridTitle">多畫面</span><span class="sp"></span>
        <span class="status" style="margin:0">點畫面放大／縮回・雙擊全螢幕・Esc 返回</span>
        <button class="btn" onclick="reloadAll()">全部重新整理</button>
        <button class="btn" onclick="toggleSplit(false)">收合</button></div>
      <div id="tiles"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 設定 ===== */
const MAX = 16;
// 與臺北城市儀表板 DE 管線 D020301 相同的來源（POST, form-urlencoded）
const API = "https://itsapi.taipei.gov.tw/TPTS_API/roadInformation/CCTVByLBS";
const API_CENTER = {lng:121.460477, lat:25.019086, distance:10000000};
const TPE = [121.5434, 25.0571];

let cams = [];                 // {id,name,lat,lng,road,stream,preview,dist}
let selected = [];             // id 陣列，順序 = 畫面編號
let place = null, placeMarker = null; const ref = () => place || me;
let me = null, watchId = null, meMarker = null, accFeature = null;
let popup = null, popupPlayer = null;
const players = new Map();     // id -> cleanup()

/* ===== 地圖 ===== */
const map = new maplibregl.Map({
  container:"map",
  style:"https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
  center:TPE, zoom:13, attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl(),"top-right");

map.on("load", async () => {
  map.addImage("cam", camIcon("#d9dde3"), {pixelRatio:2});
  map.addImage("cam-sel", camIcon("#ffb020"), {pixelRatio:2});
  map.addSource("cams",{type:"geojson",data:fc([])});
  map.addSource("acc",{type:"geojson",data:fc([])});
  map.addLayer({id:"acc",type:"fill",source:"acc",paint:{"fill-color":"#4f9cff","fill-opacity":.12}});
  map.addSource("route",{type:"geojson",data:fc([])});
  map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#000","line-width":8,"line-opacity":.5}});
  map.addLayer({id:"route",type:"line",source:"route",filter:["!",["get","straight"]],layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#3ecf8e","line-width":4}});
  map.addLayer({id:"route-straight",type:"line",source:"route",filter:["get","straight"],paint:{"line-color":"#3ecf8e","line-width":3,"line-dasharray":[2,2]}});
  map.addLayer({id:"cams",type:"symbol",source:"cams",layout:{
    "icon-image":["case",["get","sel"],"cam-sel","cam"],
    "icon-size":["interpolate",["linear"],["zoom"],11,.6,14,.95,18,1.25],
    "icon-allow-overlap":true,
    "text-field":["case",["get","sel"],["to-string",["get","no"]],""],
    "text-size":12,"text-offset":[0,-1.6],"text-allow-overlap":true,
    "symbol-sort-key":["case",["get","sel"],1,0]
  },paint:{"text-color":"#ffb020","text-halo-color":"#000","text-halo-width":1.5}});
  map.on("mouseenter","cams",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","cams",()=>map.getCanvas().style.cursor="");
  map.on("click","cams",e=>{ if(picking) return; const id=e.features[0].properties.id; openPopup(cams.find(c=>c.id===id)); });
  map.on("click",e=>{ if(!picking) return; const k=picking; pickMode(null);
    setRoutePt(k,{lat:e.lngLat.lat,lng:e.lngLat.lng,label:`地圖點 ${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)}`}); });
  restoreSel();
  await loadFromApi();
});

function camIcon(color){
  const c=document.createElement("canvas");c.width=c.height=56;const g=c.getContext("2d");
  g.fillStyle="#000a";g.beginPath();g.arc(28,28,26,0,7);g.fill();
  g.fillStyle=color;
  g.beginPath();g.roundRect(10,19,26,17,3);g.fill();          // 機身
  g.beginPath();g.moveTo(36,23);g.lineTo(46,17);g.lineTo(46,38);g.lineTo(36,32);g.fill(); // 鏡頭
  g.fillRect(19,36,4,8);g.fillRect(14,43,14,3);                // 支架
  g.fillStyle="#000";g.beginPath();g.arc(17,27,2.5,0,7);g.fill();
  return g.getImageData(0,0,56,56);
}
const fc = f => ({type:"FeatureCollection",features:f});
function refreshLayer(){
  const s=map.getSource("cams"); if(!s) return;
  s.setData(fc(cams.map(c=>({type:"Feature",geometry:{type:"Point",coordinates:[c.lng,c.lat]},
    properties:{id:c.id,sel:selected.includes(c.id),no:selected.indexOf(c.id)+1}}))));
}

/* ===== 資料載入 ===== */
async function loadFromApi(){
  setStatus("向交通局 API 取得監視器清單…");
  try{
    const body=new URLSearchParams({distance:API_CENTER.distance,lng:API_CENTER.lng,lat:API_CENTER.lat,language:"ZH"});
    const r=await fetch(API,{method:"POST",body});
    if(!r.ok) throw new Error("HTTP "+r.status);
    ingest(await r.json(),"交通局 ATIS API");
  }catch(e){
    console.warn(e);
    setStatus(`無法直接連線交通局 API（${e.message}）。可能是瀏覽器跨來源（CORS）限制。
      可改用「匯入 JSON」載入同一份資料。`,true);
  }
}
function loadFromFile(f){
  if(!f) return;
  f.text().then(t=>ingest(JSON.parse(t),"匯入檔案："+f.name)).catch(e=>setStatus("檔案解析失敗："+e.message,true));
}
// 接受：API 原始格式 {locations:[...]}、陣列、或 GeoJSON
function ingest(j,src){
  let rows=[];
  if(j && Array.isArray(j.locations)) rows=j.locations;
  else if(Array.isArray(j)) rows=j;
  else if(j && Array.isArray(j.features)) rows=j.features.map(f=>({...f.properties,

function inRing(x,y,r){ let ins=false; for(let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function cityOf(x,y){
  for(const [name,polys] of CITY_POLYS) for(const poly of polys){
    if(inRing(x,y,poly[0])&&!poly.slice(1).some(h=>inRing(x,y,h))) return name; }
  // 落在界線簡化誤差內（河岸、海岸）：取最近的縣市頂點
  let best="其他",bd=0.004**2;
  for(const [name,polys] of CITY_POLYS) for(const poly of polys) for(const ring of poly) for(const [px,py] of ring){
    const d=(px-x)**2+(py-y)**2; if(d<bd){bd=d;best=name;} }
  return best;
}

  if(!RT.mk[k]){ const el=document.createElement("div"); el.className="route-pin"; el.style.background=k==="A"?"#2e9d5b":"#d6453d"; el.textContent=k==="A"?"起":"終";
    RT.mk[k]=new maplibregl.Marker({element:el}); }
  RT.mk[k].setLngLat([pt.lng,pt.lat]).addTo(map);
  document.getElementById("rGo").disabled=!(RT.A&&RT.B);
}
// 平面近似（區域小，等距圓柱投影誤差可忽略）
function toXY(lng,lat,lat0){ return [lng*111320*Math.cos(lat0*Math.PI/180), lat*110540]; }
function routeMatch(line,buf){
  const lat0=line[0][1], P=line.map(([x,y])=>toXY(x,y,lat0)); const cum=[0];
  for(let i=1;i<P.length;i++) cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  // 先用外框篩選，減少計算量
  let [mnx,mny,mxx,mxy]=[1e9,1e9,-1e9,-1e9]; line.forEach(([x,y])=>{mnx=Math.min(mnx,x);mny=Math.min(mny,y);mxx=Math.max(mxx,x);mxy=Math.max(mxy,y);});
  const pad=buf/100000*1.5, out=[];
  for(const c of cams){
    if(c.lng<mnx-pad||c.lng>mxx+pad||c.lat<mny-pad||c.lat>mxy+pad) continue;
    const [cx,cy]=toXY(c.lng,c.lat,lat0); let bd=Infinity, ba=0;
    for(let i=1;i<P.length;i++){ const [ax,ay]=P[i-1],[bx,by]=P[i], dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
      const t=L?Math.max(0,Math.min(1,((cx-ax)*dx+(cy-ay)*dy)/L)):0, px=ax+t*dx, py=ay+t*dy, d=Math.hypot(cx-px,cy-py);
      if(d<bd){ bd=d; ba=cum[i-1]+t*Math.sqrt(L); } }
    if(bd<=buf) out.push({c,along:ba,off:bd});
  }
  return {hits:out.sort((a,b)=>a.along-b.along), total:cum[cum.length-1]};
}
async function planRoute(){
  if(!(RT.A&&RT.B)) return;
  const st=document.getElementById("rStatus"); st.classList.remove("err"); st.textContent="規劃路線中…";
  let line, straight=false, dur=null;
  try{
    const r=await fetch(`${OSRM}${RT.A.lng},${RT.A.lat};${RT.B.lng},${RT.B.lat}?overview=full&geometries=geojson`);
    if(!r.ok) throw new Error("HTTP "+r.status); const j=await r.json();
    if(j.code!=="Ok"||!j.routes?.length) throw new Error(j.message||j.code); line=j.routes[0].geometry.coordinates; dur=j.routes[0].duration;
  }catch(e){ console.warn(e); line=[[RT.A.lng,RT.A.lat],[RT.B.lng,RT.B.lat]]; straight=true; }
  RT.line=line; RT.straight=straight;
  map.getSource("route").setData(fc([{type:"Feature",properties:{straight},geometry:{type:"LineString",coordinates:line}}]));
  const buf=+document.getElementById("rBuf").value, {hits,total}=routeMatch(line,buf); RT.hits=hits; RT.total=total;
  let chosen=hits;
  if(hits.length>MAX){
    if(document.getElementById("rMode").value==="first") chosen=hits.slice(0,MAX);
    else{ chosen=[]; for(let i=0;i<MAX;i++) chosen.push(hits[Math.round(i*(hits.length-1)/(MAX-1))]); }
  }
  RT.chosen=chosen.map(h=>h.c.id);
  const b=new maplibregl.LngLatBounds(); line.forEach(p=>b.extend(p));
  const fit=()=>map.fitBounds(b,{padding:60,maxZoom:16}); fit();
  document.getElementById("rCsv").disabled=!hits.length;
  if(!hits.length){ st.textContent=`路線約 ${fmtD(total)}，沿線 ${buf} 公尺內沒有鏡頭。可放寬沿線距離後再試。`+(straight?"（路線服務無法連線，暫以直線計算）":""); return; }
  selected=[...RT.chosen]; afterSelChange(); toggleSplit(true); setTimeout(()=>{map.resize();fit();},120);
  st.innerHTML=`路線約 ${fmtD(total)}${dur?`、車程約 ${Math.round(dur/60)} 分`:""}；沿線 ${buf} 公尺內共 <b>${hits.length}</b> 支鏡頭，已依行進順序排入 ${chosen.length} 個畫面`
    +(hits.length>MAX?`（${document.getElementById("rMode").value==="first"?"從起點取前":"沿線平均取"} ${MAX} 個）`:"")
    +(straight?`<br><span style="color:var(--danger)">路線服務無法連線，暫以起終點直線計算（虛線），結果僅供參考。</span>`:"");
}
function clearRoute(){
  pickMode(null); RT.A=RT.B=RT.line=null; RT.hits=[]; RT.chosen=[];
  Object.values(RT.mk).forEach(m=>m.remove()); map.getSource("route")?.setData(fc([]));
  ["A","B"].forEach(k=>document.getElementById("r"+k).textContent="未設定");
  document.getElementById("rGo").disabled=true; document.getElementById("rCsv").disabled=true;

}
function exportRouteCsv(){
  if(!RT.hits.length) return;
  plainSave(csv(RT.hits.map((h,i)=>({沿線順序:i+1,排入多畫面:RT.chosen.includes(h.c.id)?"是（#"+(RT.chosen.indexOf(h.c.id)+1)+"）":"",

/* ===== 定位 ===== */
function toggleLocate(){
  const b=document.getElementById("locBtn");
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;b.textContent="📍 開始定位";b.classList.remove("on");return;}
  if(!navigator.geolocation){locMsg("此瀏覽器不支援定位",true);return;}
  b.textContent="⏹ 停止定位";b.classList.add("on");locMsg("定位中…（請允許瀏覽器存取位置）");
  let first=true;
  watchId=navigator.geolocation.watchPosition(p=>{
    me={lng:p.coords.longitude,lat:p.coords.latitude,acc:p.coords.accuracy};
    if(first) clearPlace(true);
    if(!meMarker){const el=document.createElement("div");el.className="me-dot";meMarker=new maplibregl.Marker({element:el});}
    meMarker.setLngLat([me.lng,me.lat]).addTo(map);
    if(!place) map.getSource("acc")?.setData(fc([circle(me.lng,me.lat,me.acc)]));
    if(!place && (first||document.getElementById("follow").checked)) map.easeTo({center:[me.lng,me.lat],zoom:first?Math.max(map.getZoom(),16):map.getZoom()});
    first=false;
    locMsg(`${me.lat.toFixed(5)}, ${me.lng.toFixed(5)}｜誤差約 ${Math.round(me.acc)} 公尺｜${new Date().toLocaleTimeString("zh-TW",{hour12:false})}`);
    updateNearBtn();
    renderList();
  },e=>{locMsg("定位失敗："+({1:"使用者拒絕授權",2:"無法取得位置",3:"逾時"}[e.code]||e.message),true);
        toggleLocate();},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function locMsg(t,err){const el=document.getElementById("locStatus");el.textContent=t;el.classList.toggle("err",!!err);}
function dist(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function circle(lng,lat,m){const pts=[];for(let i=0;i<=48;i++){const t=i/48*2*Math.PI;
  pts.push([lng+m*Math.cos(t)/(111320*Math.cos(lat*Math.PI/180)),lat+m*Math.sin(t)/110540]);}
  return {type:"Feature",geometry:{type:"Polygon",coordinates:[pts]}};}
function addNearest(){
  const a=ref(); if(!a) return;
  const R=+document.getElementById("radius").value;
  const near=cams.map(c=>({c,d:dist(a,c)})).filter(x=>x.d<=R).sort((a,b)=>a.d-b.d);
  if(!near.length){toast(`${place?"「"+place.label+"」":"目前位置"}半徑 ${R} 公尺內沒有監視器`);return;}
  let n=0; for(const {c} of near){ if(selected.length>=MAX) break; if(!selected.includes(c.id)){selected.push(c.id);n++;} }
  afterSelChange(); toast(`已加入 ${n} 個畫面`+(selected.length>=MAX?"（已達 16 個上限）":""));
  toggleSplit(true);
}

/* ===== 地點搜尋 ===== */
// 地名／地址：OpenStreetMap Nominatim（免金鑰，限每秒 1 次，故採按 Enter 才查詢）
// 另外同時比對監視器名稱（路口名），兩種結果合併顯示
const BBOX="121.28,25.30,121.80,24.90"; // 雙北範圍（西,北,東,南）
async function geoSearch(e){
  e?.preventDefault();
  const q=document.getElementById("geoQ").value.trim(); const box=document.getElementById("geoRes");
  if(!q){box.style.display="none";return;}
  box.style.display="block"; box.innerHTML=`<div class="info">搜尋中…</div>`;
  // 1) 監視器名稱比對（例如「復興北路」「民權東路」）
  const keys=q.split(/[\s、,，與和及&]+/).filter(Boolean);
  const camHits=cams.filter(c=>keys.every(k=>c.name.includes(k))).slice(0,5)
    .map(c=>({label:c.name,sub:"監視器位置",lat:c.lat,lng:c.lng,cam:true}));
  // 2) 地名／地址
  let geoHits=[], err="";
  try{
    const u=new URL("https://nominatim.openstreetmap.org/search");
    u.search=new URLSearchParams({q,format:"jsonv2",limit:8,countrycodes:"tw","accept-language":"zh-TW",viewbox:BBOX,bounded:1});
    const r=await fetch(u); if(!r.ok) throw new Error("HTTP "+r.status);
    geoHits=(await r.json()).map(x=>({label:x.name||x.display_name.split(",")[0],sub:x.display_name,lat:+x.lat,lng:+x.lon}));
    if(!geoHits.length){ // 範圍外再試一次（例如使用者打其他縣市）
      u.searchParams.delete("bounded"); const r2=await fetch(u);
      if(r2.ok) geoHits=(await r2.json()).map(x=>({label:x.name||x.display_name.split(",")[0],sub:x.display_name,lat:+x.lat,lng:+x.lon}));
    }
  }catch(ex){ err="地名查詢服務無法連線（"+ex.message+"）"; }
  const all=[...camHits,...geoHits];
  if(!all.length){box.innerHTML=`<div class="info">${err||"找不到「"+esc(q)+"」，可試試加上行政區或改用路口名稱。"}</div>`;return;}
  box.innerHTML=all.map((h,i)=>`<div class="r" data-i="${i}">${h.cam?'<span class="tag">監視器</span>':""}${esc(h.label)}<small>${esc(h.sub)}</small></div>`).join("")
    +(err?`<div class="info">${esc(err)}</div>`:"");
  box.querySelectorAll(".r").forEach(el=>el.onclick=()=>setPlace(all[+el.dataset.i]));
}
function setPlace(h){
  place={lat:h.lat,lng:h.lng,label:h.label};
  if(!placeMarker){const el=document.createElement("div");el.className="place-pin";placeMarker=new maplibregl.Marker({element:el,anchor:"bottom-left"});}
  placeMarker.setLngLat([h.lng,h.lat]).addTo(map);
  map.getSource("acc")?.setData(fc([circle(h.lng,h.lat,+document.getElementById("radius").value)]));
  map.flyTo({center:[h.lng,h.lat],zoom:16.5});
  document.getElementById("geoRes").style.display="none";
  document.getElementById("geoQ").value=h.label;
  document.getElementById("geoClear").style.display="";
  document.getElementById("q").value="";
  updateNearBtn(); renderList();
  if(window.innerWidth<=820) document.getElementById("app").classList.add("side");
}
function clearPlace(silent){
  place=null; placeMarker?.remove();
  document.getElementById("geoClear").style.display="none";
  if(!silent){document.getElementById("geoQ").value="";document.getElementById("geoRes").style.display="none";}
  map.getSource("acc")?.setData(fc(me?[circle(me.lng,me.lat,me.acc)]:[]));
  if(me) map.easeTo({center:[me.lng,me.lat]});
  updateNearBtn(); renderList();
}
function updateNearBtn(){
  const b=document.getElementById("nearBtn"); b.disabled=!ref();
  b.textContent=place?`加入「${place.label.slice(0,8)}」附近的畫面`:"加入最近的畫面";
}
document.getElementById("geoQ").addEventListener("input",e=>{if(!e.target.value) document.getElementById("geoRes").style.display="none";});
document.getElementById("radius").addEventListener("change",()=>{ if(place) map.getSource("acc")?.setData(fc([circle(place.lng,place.lat,+document.getElementById("radius").value)])); });

/* ===== 清單 ===== */
function renderList(){
  const q=document.getElementById("q").value.trim();
  const R=+document.getElementById("radius").value;
  const a=ref();
  let rows=cams.map(c=>({...c,dist:a?dist(a,c):null}));
  if(q) rows=rows.filter(c=>c.name.includes(q)||c.id.includes(q));
  else if(a) rows=rows.filter(c=>c.dist<=R);
  rows.sort((a,b)=>(selected.includes(b.id)-selected.includes(a.id))||((a.dist??0)-(b.dist??0))||a.name.localeCompare(b.name,"zh-Hant"));
  const el=document.getElementById("list");
  const hint=!q&&!a?`<div class="status" style="padding:8px 14px">定位或在地圖上方搜尋地點後，會列出附近監視器；也可直接輸入路名篩選。</div>`
    :(!q&&a?`<div class="status" style="padding:8px 14px">以「${esc(place?place.label:"我的位置")}」為中心，半徑 ${fmtD(R)}</div>`:"");
  el.innerHTML=hint+rows.slice(0,300).map(c=>`<div class="item ${selected.includes(c.id)?"sel":""}" data-id="${c.id}">
    <span class="ck"></span><span class="nm" title="${esc(c.name)}">${esc(c.name)}</span>
    <span class="d">${c.dist!=null?fmtD(c.dist):""}</span></div>`).join("")
    +(rows.length>300?`<div class="status" style="padding:8px 14px">僅顯示前 300 筆，請輸入關鍵字縮小範圍。</div>`:"")
    +(!rows.length&&(q||a)?`<div class="status" style="padding:8px 14px">沒有符合的監視器。</div>`:"");
  el.querySelectorAll(".item").forEach(it=>{
    it.onclick=e=>{const c=cams.find(x=>x.id===it.dataset.id);toggleSel(c.id);};
    it.ondblclick=()=>{const c=cams.find(x=>x.id===it.dataset.id);map.flyTo({center:[c.lng,c.lat],zoom:17});openPopup(c);};
  });
}
const fmtD=d=>d<1000?Math.round(d)+" m":(d/1000).toFixed(1)+" km";
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

/* ===== 選取 ===== */

  const i=selected.indexOf(id);
  if(i>=0) selected.splice(i,1);
  else{ if(selected.length>=MAX){toast("最多同時 16 個畫面，請先移除其他畫面");return false;} selected.push(id); }
  afterSelChange(); return true;
}
function clearAll(){selected=[];afterSelChange();}
function afterSelChange(){

/* ===== 播放器：依網址格式自動判斷 ===== */
// 原儀表板 MapPopup：.m3u8/含 hls → hls.js；freeway.gov.tw → <img>；youtube → iframe；其餘 → <video>
// 另加：<video> 播放失敗時自動改用 <img>（部分路口為 MJPEG 串流或快照）
function mountPlayer(host,c){
  host.innerHTML=""; const url=c.stream;
  const msg=document.createElement("div");msg.className="msg";msg.textContent="影像載入中…";host.appendChild(msg);
  const hide=()=>msg.style.display="none";
  if(!url){msg.textContent="此監視器沒有影像網址";return()=>{};}

  // 候選網址：頁面是 https 而影像是 http 時，瀏覽器會擋（混合內容），先改試 https
  const urls=[url];
  if(location.protocol==="https:"&&/^http:/i.test(url)) urls.unshift(url.replace(/^http:/i,"https:"));

  // 依網址決定嘗試順序；每一種失敗或逾時就換下一種，最後用 iframe 直接嵌入（多數 ATIS／新北的播放頁屬此類）
  let order;
  if(/youtube\.com|youtu\.be/i.test(url)) order=["iframe"];
  else if(/\.m3u8|hls/i.test(url)) order=["hls","img","iframe"];
  else if(/freeway\.gov\.tw|\.jpe?g|\.png|mjpe?g|snapshot|cgi-bin/i.test(url)) order=["img","video","iframe"];
  else order=["video","img","iframe"];
  const steps=[]; for(const u of urls) for(const k of order) steps.push([k,u]);

  let hls=null, el=null, timer=null, to=null, dead=false, i=-1;
  const clean=()=>{ clearTimeout(to); if(timer){clearInterval(timer);timer=null;} if(hls){hls.destroy();hls=null;}
    if(el){ el.onerror=el.onload=el.onplaying=null; if(el.tagName==="VIDEO"){el.pause();el.removeAttribute("src");el.load();} else el.src="about:blank"; el.remove(); el=null; } };
  const next=()=>{
    if(dead) return; clean(); i++;
    if(i>=steps.length){
      msg.innerHTML=`此鏡頭影像無法嵌入本頁（伺服器拒絕或已離線）<br><a href="${esc(url)}" target="_blank" rel="noopener">在新分頁開啟</a>`;
      msg.style.display="flex"; return; }
    const [k,u]=steps[i]; msg.textContent="影像載入中…"; msg.style.display="flex";
    to=setTimeout(next, k==="iframe"?0:9000);   // 9 秒沒畫面就換下一種方式
    if(k==="video"||k==="hls"){
      el=document.createElement("video"); Object.assign(el,{muted:true,autoplay:true,playsInline:true,loop:true});
      el.setAttribute("referrerpolicy","no-referrer");
      el.onplaying=()=>{clearTimeout(to);hide();}; el.onerror=next;
      host.prepend(el);
      if(k==="hls"){
        if(window.Hls&&Hls.isSupported()){hls=new Hls({lowLatencyMode:true});hls.loadSource(u);hls.attachMedia(el);
          hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal) next();});}
        else if(el.canPlayType("application/vnd.apple.mpegurl")) el.src=u; else return next();
      } else el.src=u;
      el.play?.().catch(()=>{});
    }else if(k==="img"){
      el=document.createElement("img"); el.alt=c.name; el.referrerPolicy="no-referrer";
      el.onload=()=>{clearTimeout(to);hide();}; el.onerror=next; el.src=u; host.prepend(el);
      if(/\.(jpe?g|png)(\?|$)/i.test(u)) timer=setInterval(()=>{if(el) el.src=u+(u.includes("?")?"&":"?")+"_t="+Date.now();},5000);
    }else{ // iframe：跨網域無法偵測是否成功，直接顯示
      clearTimeout(to);
      el=document.createElement("iframe"); el.src=u; el.allow="autoplay; encrypted-media; fullscreen";
      el.referrerPolicy="no-referrer"; el.setAttribute("scrolling","no"); el.className="embed";
      host.prepend(el); hide();
    }
  };
  next();
  return ()=>{ dead=true; clean(); host.innerHTML=""; };
}

/* ===== 多畫面格 ===== */
function layout(n){ // 回傳欄數
  const wide=document.getElementById("tiles").clientWidth>=document.getElementById("tiles").clientHeight;
  if(n<=1) return 1; if(n<=2) return wide?2:1; if(n<=4) return 2; if(n<=6) return wide?3:2; if(n<=9) return 3; if(n<=12) return wide?4:3; return 4;
}
function renderTiles(){
  const box=document.getElementById("tiles");
  document.getElementById("gridTitle").textContent=`多畫面（${selected.length}/16）`;
  // 移除已取消者
  for(const [id,clean] of players){ if(!selected.includes(id)){recorders.get(id)?.stop();clean();players.delete(id);box.querySelector(`[data-id="${CSS.escape(id)}"]`)?.remove();} }
  box.querySelector(".empty")?.remove();
  if(!box.querySelector(".tile.focus")) box.classList.remove("hasfocus");
  if(!selected.length){box.style.gridTemplateColumns="1fr";box.innerHTML=`<div class="empty">在地圖點選監視器並按「加入多畫面」，<br>或按左側清單、「加入最近的畫面」。最多 16 個。</div>`;return;}
  selected.forEach((id,i)=>{
    const c=cams.find(x=>x.id===id); if(!c) return;
    let t=box.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);
    if(!t){
      t=document.createElement("div");t.className="tile";t.dataset.id=id;
      t.innerHTML=`<div class="v" style="position:absolute;inset:0"></div><div class="hit"></div><div class="rec">● REC</div><div class="cap"><span class="no"></span><span class="n">${esc(c.name)}</span>
        <button data-a="loc" title="地圖定位">⌖</button><button data-a="big" title="放大／縮回">⤢</button><button data-a="snap" title="截圖下載">📷</button><button data-a="recd" title="錄影下載">⏺</button>
        <button data-a="re" title="重新整理">↻</button><a data-a="open" title="在新分頁開啟" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;background:#0008;border:1px solid #fff3;border-radius:4px;padding:0 6px;font-size:12px">↗</a><button data-a="x" title="移除">✕</button></div>`;
      t.querySelector("[data-a=x]").onclick=()=>toggleSel(id);
      t.querySelector("[data-a=open]").href=c.stream||"#"; t.title=c.stream||"";
      t.querySelector("[data-a=re]").onclick=()=>{players.get(id)?.();players.set(id,mountPlayer(t.querySelector(".v"),c));};
      t.querySelector("[data-a=big]").onclick=()=>toggleFocus(t);
      t.querySelector(".hit").onclick=()=>toggleFocus(t);
      t.querySelector(".hit").ondblclick=()=>{ (document.fullscreenElement?document.exitFullscreen():t.requestFullscreen?.())?.catch?.(()=>{}); };
      t.querySelector("[data-a=snap]").onclick=()=>snapTile(id);
      t.querySelector("[data-a=recd]").onclick=()=>recordTile(id);
      t.querySelector("[data-a=loc]").onclick=()=>{ if(window.innerWidth<=820) toggleSplit(false); map.flyTo({center:[c.lng,c.lat],zoom:17}); };
      players.set(id,mountPlayer(t.querySelector(".v"),c));
    }
    t.querySelector(".no").textContent=i+1; t.style.order=i; box.appendChild(t);
  });
  const cols=layout(selected.length);
  box.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  box.style.gridTemplateRows=`repeat(${Math.ceil(selected.length/cols)},1fr)`;
}
function reloadAll(){ for(const id of selected){const t=document.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);
  const c=cams.find(x=>x.id===id); players.get(id)?.(); players.set(id,mountPlayer(t.querySelector(".v"),c)); } }

/* ===== 介面切換 ===== */
function toggleSplit(force){
  const app=document.getElementById("app"); const on=force??!app.classList.contains("split");
  app.classList.toggle("split",on);
  document.getElementById("viewBtn").textContent=on?(window.innerWidth<=820?"地圖":"收合多畫面"):"多畫面";
  setTimeout(()=>{map.resize();renderTiles();},50);
}
function toggleSide(){document.getElementById("app").classList.toggle("side");}
/* ===== 放大 ===== */
function toggleFocus(t){
  const box=document.getElementById("tiles"), on=!t.classList.contains("focus");
  box.querySelectorAll(".tile.focus").forEach(x=>x.classList.remove("focus"));
  t.classList.toggle("focus",on); box.classList.toggle("hasfocus",on);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const f=document.querySelector(".tile.focus"); if(f&&!document.fullscreenElement) toggleFocus(f);} });

/* ===== 拖曳分隔線：調整地圖／多畫面寬度 ===== */
(()=>{ const sp=document.getElementById("splitter"), main=document.getElementById("main");
  try{const w=localStorage.getItem("cctv-gridW"); if(w) document.documentElement.style.setProperty("--gridW",w);}catch(e){}
  sp.addEventListener("pointerdown",e=>{ sp.setPointerCapture(e.pointerId); sp.classList.add("drag"); document.body.classList.add("dragging"); });
  sp.addEventListener("pointermove",e=>{ if(!sp.classList.contains("drag")) return;
    const r=main.getBoundingClientRect(); let w=r.right-e.clientX; w=Math.max(240,Math.min(r.width-160,w));
    document.documentElement.style.setProperty("--gridW",w+"px"); map.resize(); });
  const end=()=>{ if(!sp.classList.contains("drag")) return; sp.classList.remove("drag"); document.body.classList.remove("dragging");
    try{localStorage.setItem("cctv-gridW",getComputedStyle(document.documentElement).getPropertyValue("--gridW"));}catch(e){}
    renderTiles(); };
  sp.addEventListener("pointerup",end); sp.addEventListener("pointercancel",end);
  sp.addEventListener("dblclick",()=>{document.documentElement.style.removeProperty("--gridW");try{localStorage.removeItem("cctv-gridW")}catch(e){};map.resize();renderTiles();});
})();

/* ===== 下載 ===== */
const dlLog=[];
const pad=n=>String(n).padStart(2,"0");
const stamp=(d=new Date())=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
const human=(d=new Date())=>d.toLocaleString("zh-TW",{hour12:false});
const safe=s=>String(s).replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,40);
const tileOf=id=>document.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);
const mediaOf=id=>tileOf(id)?.querySelector(".v video, .v img, .v iframe");

async function saveBlob(blob,file,c,kind,startAt){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  let hash="";
  try{ hash=[...new Uint8Array(await crypto.subtle.digest("SHA-256",await blob.arrayBuffer()))].map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){ hash="（此瀏覽器環境無法計算）"; }
  const rec={下載時間:human(),類型:kind,擷取起始:startAt?human(startAt):"",鏡頭編號:c.id,鏡頭名稱:c.name,緯度:c.lat,經度:c.lng,影像來源網址:c.stream,檔名:file,位元組:blob.size,SHA256:hash};
  dlLog.push(rec);
  const el=document.getElementById("dlLog"); const d=document.createElement("div");
  d.textContent=`${rec.下載時間}｜${kind}｜${c.name}`; d.title=`${file}\nSHA-256: ${hash}`; el.prepend(d);
}
// 在影格上加註鏡頭名稱與時間
function burn(g,w,h,c,t){
  const fs=Math.max(12,Math.round(h/26)), txt=`${c.name}（${c.id}）  ${human(t)}`;
  g.font=`${fs}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
  const tw=g.measureText(txt).width; g.fillStyle="rgba(0,0,0,.6)"; g.fillRect(0,h-fs*1.7,tw+fs,fs*1.7);
  g.fillStyle="#fff"; g.fillText(txt,fs/2,h-fs*.55);
}
function dims(el){ return el.tagName==="VIDEO"?[el.videoWidth,el.videoHeight]:[el.naturalWidth,el.naturalHeight]; }
function loadCorsImage(url,ms=7000){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.referrerPolicy="no-referrer";
  const t=setTimeout(()=>{im.src="";rej(new Error("逾時"));},ms); im.onload=()=>{clearTimeout(t);res(im);}; im.onerror=()=>{clearTimeout(t);rej(new Error("拒絕"));};
  im.src=url+(url.includes("?")?"&":"?")+"_t="+Date.now(); }); }
// 以跨網域授權方式另開一個隱藏影片（伺服器有開放 CORS 時才能被擷取）
function loadCorsVideo(url,ms=9000){ return new Promise((res,rej)=>{
  const v=document.createElement("video"); Object.assign(v,{muted:true,playsInline:true,autoplay:true,loop:true}); v.crossOrigin="anonymous";
  v.style.cssText="position:fixed;left:-9999px;width:2px;height:2px"; document.body.appendChild(v); let h=null;
  const kill=()=>{ if(h) h.destroy(); v.pause(); v.removeAttribute("src"); v.load(); v.remove(); };
  const t=setTimeout(()=>{kill();rej(new Error("逾時"));},ms);
  v.onplaying=()=>{clearTimeout(t); v._kill=kill; res(v);}; v.onerror=()=>{clearTimeout(t);kill();rej(new Error("拒絕"));};
  if(/\.m3u8|hls/i.test(url)&&window.Hls&&Hls.isSupported()){ h=new Hls(); h.loadSource(url); h.attachMedia(v);
    h.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){clearTimeout(t);kill();rej(new Error("串流錯誤"));} }); }
  else v.src=url;
  v.play().catch(()=>{});
}); }
function canvasFrom(src,c,t){ const [w,h]=dims(src); if(!w||!h) throw new Error("尚無畫面");
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const g=cv.getContext("2d");
  g.drawImage(src,0,0,w,h); burn(g,w,h,c,t); g.getImageData(0,0,1,1); /* 跨網域未授權時這裡會丟出 SecurityError */ return cv; }
const toBlob=cv=>new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("轉檔失敗")),"image/png"));

async function snapTile(id,quiet){
  const c=cams.find(x=>x.id===id), el=mediaOf(id), t=new Date(); if(!c) return false;
  const file=`CCTV_${safe(c.id)}_${safe(c.name)}_${stamp(t)}.png`;
  // 1) 直接擷取目前顯示的畫面
  if(el&&el.tagName!=="IFRAME"){ try{ await saveBlob(await toBlob(canvasFrom(el,c,t)),file,c,"截圖",t); return true; }catch(e){} }
  // 2) 以跨網域授權方式重新抓取影像或預覽圖
  if(el&&el.tagName==="VIDEO"&&c.stream){
    try{ const v=await loadCorsVideo(c.stream); try{ await saveBlob(await toBlob(canvasFrom(v,c,t)),file,c,"截圖",t); return true; } finally{ v._kill(); } }catch(e){}
  }
  for(const u of [c.stream,c.preview].filter(u=>u&&!/\.m3u8|\.mp4/i.test(u))){
    try{ const im=await loadCorsImage(u); await saveBlob(await toBlob(canvasFrom(im,c,t)),file,c,"截圖",t); return true; }catch(e){}
  }
  if(!quiet) toast(`「${c.name}」的伺服器不允許網頁擷取畫面，請按 ↗ 在新分頁開啟後用系統截圖`);
  return false;
}
async function snapAll(){
  if(!selected.length){toast("尚未選取任何畫面");return;}
  let ok=0,ng=[];
  for(const id of [...selected]){ (await snapTile(id,true))?ok++:ng.push(cams.find(x=>x.id===id)?.name); await new Promise(r=>setTimeout(r,350)); }
  toast(`截圖完成 ${ok} 張`+(ng.length?`；${ng.length} 個鏡頭不允許擷取：${ng.slice(0,3).join("、")}${ng.length>3?"…":""}`:""));
}

const recorders=new Map();
function pickMime(){ for(const m of ["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"]) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; return ""; }
async function recordTile(id,quiet){
  const c=cams.find(x=>x.id===id), t=tileOf(id);
  if(recorders.has(id)){ recorders.get(id).stop(); return true; }   // 再按一次＝提早結束
  let el=mediaOf(id), helper=null;
  if(!window.MediaRecorder){ if(!quiet) toast("此瀏覽器不支援錄影"); return false; }
  if(!el||el.tagName==="IFRAME"){ if(!quiet) toast(`「${c.name}」是內嵌播放頁，無法由本頁錄影，請用新分頁開啟後以系統螢幕錄影`); return false; }
  const [w,h]=dims(el); if(!w){ if(!quiet) toast(`「${c.name}」尚未出現畫面`); return false; }
  // 先用測試畫布檢查能否擷取（畫布一旦被跨網域畫面「汙染」就無法再用，所以不能用正式畫布測）
  const canGrab=src=>{ try{ const tc=document.createElement("canvas"); tc.width=tc.height=2; const tg=tc.getContext("2d"); tg.drawImage(src,0,0,2,2); tg.getImageData(0,0,1,1); return true; }catch(e){ return false; } };
  if(!canGrab(el)){ // 目前畫面無法擷取 → 改用跨網域授權的隱藏影片來錄
    try{ if(el.tagName!=="VIDEO") throw 0; helper=await loadCorsVideo(c.stream); if(!canGrab(helper)) throw 0; el=helper; }
    catch(e){ helper?._kill(); if(!quiet) toast(`「${c.name}」的伺服器不允許網頁錄影，請用新分頁開啟後以系統螢幕錄影`); return false; } }
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const g=cv.getContext("2d");
  const mime=pickMime(), stream=cv.captureStream(15), mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:2500000}:{});
  const chunks=[], start=new Date(), sec=+document.getElementById("recSec").value;
  let raf, stopT; const draw=()=>{ try{ g.drawImage(el,0,0,w,h); burn(g,w,h,c,new Date()); }catch(e){} raf=requestAnimationFrame(draw); }; draw();
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=async()=>{ cancelAnimationFrame(raf); helper?._kill(); clearTimeout(stopT); clearInterval(tick); recorders.delete(id); t?.classList.remove("recording");
    const type=mr.mimeType||mime||"video/webm", ext=type.includes("mp4")?"mp4":"webm";
    await saveBlob(new Blob(chunks,{type}),`CCTV_${safe(c.id)}_${safe(c.name)}_${stamp(start)}_${Math.round((Date.now()-start)/1000)}s.${ext}`,c,"錄影",start);
    updateRecAllBtn(); };
  mr.start(1000); recorders.set(id,mr); t?.classList.add("recording");
  const lab=t?.querySelector(".rec"); const tick=setInterval(()=>{ if(lab) lab.textContent=`● REC ${Math.round((Date.now()-start)/1000)}/${sec}s`; },500);
  stopT=setTimeout(()=>mr.state!=="inactive"&&mr.stop(), sec*1000);
  updateRecAllBtn(); return true;
}
async function recordAll(){
  if(recorders.size){ [...recorders.values()].forEach(r=>r.state!=="inactive"&&r.stop()); return; }
  if(!selected.length){toast("尚未選取任何畫面");return;}
  let ok=0,ng=[]; for(const id of [...selected]) (await recordTile(id,true))?ok++:ng.push(cams.find(x=>x.id===id)?.name);
  toast(`開始錄影 ${ok} 個畫面`+(ng.length?`；${ng.length} 個無法錄影（伺服器不允許或為內嵌頁）`:""));
}
function updateRecAllBtn(){ document.getElementById("recAllBtn").textContent=recorders.size?`⏹ 停止錄影（${recorders.size}）`:"⏺ 全部錄影"; }

function csv(rows){ if(!rows.length) return ""; const k=Object.keys(rows[0]); const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  return "﻿"+[k.map(q).join(","),...rows.map(r=>k.map(x=>q(r[x])).join(","))].join("\r\n"); }
function plainSave(text,file){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"})); a.download=file; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),60000); }
function exportCsv(all){
  const list=all?cams:selected.map(id=>cams.find(c=>c.id===id)).filter(Boolean);
  if(!list.length){toast(all?"尚未載入監視器資料":"尚未選取任何畫面");return;}
  const a=ref();
  plainSave(csv(list.map((c,i)=>({序:all?"":i+1,鏡頭編號:c.id,鏡頭名稱:c.name,縣市:c.city,緯度:c.lat,經度:c.lng,道路類型:c.road,
    [a?`距${place?place.label:"我的位置"}(公尺)`:"距離"]:a?Math.round(dist(a,c)):"",影像網址:c.stream,預覽圖網址:c.preview,匯出時間:human()}))),
    `CCTV_${all?"全部":"已選"}清單_${stamp()}.csv`);
}
function exportLog(){ if(!dlLog.length){toast("本次尚未下載任何截圖或錄影");return;} plainSave(csv(dlLog),`CCTV_下載紀錄_${stamp()}.csv`); }

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display="none",2500);}
window.addEventListener("resize",()=>{if(selected.length) renderTiles();});
</script>
